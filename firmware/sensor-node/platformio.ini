; Sentry Sonar — sensor node (Freenove ESP32-S3-WROOM-1 + LD2410C radar)
; esp32-s3-devkitc-1 is the correct generic board id for the WROOM-1 module.
; Flash/monitor via the board's UART (CH340) USB-C port.
[env:sensor-node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; No radar lib needed — presence is read straight off the LD2410C OUT pin
; with a single digitalRead(). WiFi/HTTP libs come from the arduino framework.
lib_deps =
