; Sentry Sonar — sensor node (Freenove ESP32-S3-WROOM-1 + LD2410C radar)
; esp32-s3-devkitc-1 is the correct generic board id for the WROOM-1 module.
; Flash/monitor via the board's UART (CH340/CH343) USB-C port.
;
; Per-sensor identity (room id + token) and the WiFi password are injected at
; flash time by flash-sensor.sh, which writes src/config.gen.h (gitignored).
; See README.md → "Flashing a sensor".
[env:sensor-node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; WiFi/HTTP come from the arduino framework; presence is a single digitalRead().
lib_deps =
