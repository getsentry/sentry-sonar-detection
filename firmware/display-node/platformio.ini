; Sentry Sonar — display node (Waveshare ESP32-S3-ePaper-1.54, BW 200x200)
;
; Integrated AIoT board: ESP32-S3 + onboard 1.54" e-paper, everything wired
; internally so the pin map below is FIXED (from Waveshare's demo, board
; ESP32-S3-ePaper-1.54). The panel is an SSD1681 200x200 B/W -> GxEPD2_154_D67.
;
; The board has a single native-USB Type-C (no UART bridge), so `Serial` needs
; USB-CDC-on-boot to appear. Flash/monitor over that one port.
[env:display-node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
  -DARDUINO_USB_MODE=1          ; use the S3's built-in USB (not a UART bridge)
  -DARDUINO_USB_CDC_ON_BOOT=1   ; expose Serial over native USB so logs show up
lib_deps =
  zinggjm/GxEPD2            ; e-paper driver (pulls in Adafruit GFX)
  adafruit/Adafruit GFX Library
